name: CiFixIt
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull all code
        uses: actions/checkout@v7

      - name: install .Net10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: restore
        run: dotnet restore

      - name: build
        run: dotnet build --no-restore --configuration Release

      - name: Test project
        run: dotnet test --no-build --configuration Release

      - name: run code
        run: dotnet run --project src/FixIT.Presentation/FixIT.Presentation.csproj
